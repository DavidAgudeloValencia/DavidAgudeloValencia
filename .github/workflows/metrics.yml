name: GitHub Metrics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generar actividad de GitHub
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAgudeloValencia
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_load: 300
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_timestamps: true
          plugin_activity_filter: push,issue,pr,release,fork,review,ref/create
