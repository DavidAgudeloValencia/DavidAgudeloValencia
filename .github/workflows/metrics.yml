name: GitHub Metrics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📅 Calendario de contribuciones
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAgudeloValencia
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes

      - name: 🈷️ Lenguajes más utilizados
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAgudeloValencia
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_other: no
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugins_errors_fatal: yes

      - name: 📌 Repositorios destacados
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DavidAgudeloValencia
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 6
          plugin_repositories_order: pinned
          plugins_errors_fatal: yes
